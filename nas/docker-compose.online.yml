services:
  archivabruf:
    build: .
    entrypoint: ["python3", "/app/abrufen.py"]
    command: ["--dauerhaft"]
    env_file: ./abruf.env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - archiv:/archiv
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  archiv:
