services:
  archivabruf:
    build: .
    entrypoint: ["python3", "/app/abrufen.py"]
    command: ["--dauerhaft"]
    env_file: ./abruf.env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - archiv:/archiv
    tmpfs:
      - /tmp:size=1m,mode=1777
    healthcheck:
      test: ["CMD", "python3", "-c", "from abrufen import health_status; raise SystemExit(health_status())"]
      interval: 1m
      timeout: 10s
      retries: 1
      start_period: 3m
    stop_grace_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  archiv:
