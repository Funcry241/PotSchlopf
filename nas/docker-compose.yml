services:
  archiv:
    build: .
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - archiv:/archiv
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  archiv:
