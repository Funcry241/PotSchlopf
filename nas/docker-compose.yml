# PotSchlopf auf dem NAS: holt die öffentlichen Notizen jede Minute ab
# und legt sie im eigenen Archiv-Volume ab. Das NAS baut die Verbindung
# selbst auf; aus dem Internet führt kein Weg herein (kein Port wird geöffnet).
#
# Für die Einrichtung muss in dieser Datei nichts geändert werden.

services:
  archivabruf:
    build: .
    entrypoint: ["python3", "/app/abrufen.py"]
    command: ["--dauerhaft"]
    environment:
      POTSCHLOPF_SERVICE_URL: "https://potschlopf.alpinesong8.chatgpt.site"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - archiv:/archiv
    # Kleiner Merkzettel im Arbeitsspeicher für die Zustandsanzeige.
    tmpfs:
      - /tmp:size=1m,mode=1777
    # Container Manager zeigt "gesund", solange der letzte erfolgreiche Abruf
    # weniger als 15 Minuten her ist. Bei Störungen wird es "ungesund",
    # der Abruf versucht es aber von selbst weiter.
    healthcheck:
      test: ["CMD", "python3", "-c", "from abrufen import health_status; raise SystemExit(health_status())"]
      interval: 1m
      timeout: 10s
      retries: 1
      start_period: 3m
    stop_grace_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  archiv:
